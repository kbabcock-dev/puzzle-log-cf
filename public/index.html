<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puzzle Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#e8eef2;--panel:#fff;--ink:#1b2a41;--mute:#5c6b80;--line:#cfd9e2;--accent:#e0a526;--accent-ink:#1b2a41;--teal:#2a7f7b;--danger:#b3372c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121b29;--panel:#1b2a41;--ink:#eef2f6;--mute:#9fb0c4;--line:#2f4260;--teal:#5cc2bb;--danger:#ff8a7d}}
:root[data-theme="dark"]{--bg:#121b29;--panel:#1b2a41;--ink:#eef2f6;--mute:#9fb0c4;--line:#2f4260;--teal:#5cc2bb;--danger:#ff8a7d}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:28px 18px 60px}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}
h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;letter-spacing:-.02em;line-height:1}
.totals{display:flex;gap:22px;color:var(--mute);font-size:.95rem}
.totals b{display:block;font:800 1.7rem/1 "Bricolage Grotesque",sans-serif;color:var(--ink)}
.layout{display:grid;grid-template-columns:320px 1fr;gap:22px;align-items:start}
@media(max-width:780px){.layout{grid-template-columns:1fr}}
form{background:var(--panel);border:2px solid var(--ink);border-radius:14px;padding:18px;display:grid;gap:14px;position:relative}
form::after{content:"";position:absolute;right:26px;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--panel);border:2px solid var(--ink);clip-path:inset(0 0 50% 0)}
h2{font-size:1.25rem}
label{display:grid;gap:5px;font-weight:600;font-size:.92rem}
input{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
input[type=file]{padding:8px;font-size:.88rem}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button{font:600 1rem Figtree,sans-serif;cursor:pointer;border-radius:8px;border:0;padding:11px 16px}
.primary{background:var(--accent);color:var(--accent-ink)}
.primary:hover{filter:brightness(1.06)}
.preview{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1.5px solid var(--line);display:none}
.err{color:var(--danger);font-size:.88rem;min-height:1.2em;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card .ph{aspect-ratio:4/3;width:100%;object-fit:cover;background:var(--line);display:block;cursor:zoom-in;border:0;padding:0}
.card .nophoto{aspect-ratio:4/3;display:grid;place-items:center;color:var(--mute);background:var(--line);font-size:.9rem}
.card .body{padding:12px 14px 14px;display:grid;gap:3px}
.card h3{margin:0;font:700 1.05rem/1.25 "Bricolage Grotesque",sans-serif}
.meta{color:var(--mute);font-size:.88rem}
.pieces{display:inline-block;background:var(--teal);color:#fff;border-radius:99px;padding:1px 10px;font-size:.82rem;font-weight:600;justify-self:start;margin-top:4px}
:root[data-theme="dark"] .pieces,:root:not([data-theme="light"]) .pieces{color:#0e1a26}
@media(prefers-color-scheme:light){.pieces{color:#fff}}
.del{background:none;color:var(--mute);padding:6px 0 0;justify-self:start;font-size:.85rem;font-weight:500;text-decoration:underline}
.del:hover{color:var(--danger)}
.empty{border:2px dashed var(--line);border-radius:12px;padding:36px 20px;text-align:center;color:var(--mute)}
dialog{border:0;padding:0;background:none;max-width:94vw;max-height:94vh}
dialog::backdrop{background:rgba(0,0,0,.75)}
dialog img{max-width:94vw;max-height:88vh;border-radius:10px;display:block}
dialog button{margin-top:8px;background:var(--panel);color:var(--ink)}
[hidden]{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 18px}
.authwrap{width:min(420px,100%);display:grid;gap:18px}
.tag{margin:0;color:var(--mute)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:4px;border-radius:10px}
.tabs button{background:none;color:var(--mute);padding:8px}
.tabs button[aria-selected=true]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1.5px var(--ink) inset}
.hint{margin:0;color:var(--mute);font-size:.85rem;min-height:1.2em}
</style>
</head>
<body>
<section id="auth" class="auth" hidden>
  <div class="authwrap">
    <h1>Puzzle Log</h1>
    <p class="tag">Keep a record of every puzzle you finish: the date, the piece count and a photo of the finished picture.</p>
    <form id="af" novalidate>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tabLogin" aria-selected="true">Log in</button>
        <button type="button" role="tab" id="tabSignup" aria-selected="false">Sign up</button>
      </div>
      <label>Username<input id="u" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="30" required></label>
      <label>Password<input id="p" type="password" autocomplete="current-password" maxlength="200" required></label>
      <p class="hint" id="ahint"></p>
      <p class="err" id="aerr" role="alert"></p>
      <button class="primary" type="submit" id="asubmit">Log in</button>
    </form>
  </div>
</section>
<main id="app" hidden>
<header>
  <h1>Puzzle Log</h1>
  <div class="totals"><div><b id="tCount">0</b>puzzles</div><div><b id="tPieces">0</b>pieces placed</div><div><b id="who" style="font-size:1.1rem"></b><button type="button" id="logout" class="del">Log out</button></div></div>
</header>
<div class="layout">
  <form id="f" novalidate>
    <h2>Log a puzzle</h2>
    <label>Date completed<input type="date" id="date" required></label>
    <label>Puzzle name<input type="text" id="name" maxlength="120" placeholder="e.g. Amalfi Coast" required></label>
    <label>Number of pieces<input type="number" id="pieces" min="1" max="100000" inputmode="numeric" placeholder="e.g. 1000" required></label>
    <label>Photo<input type="file" id="photo" accept="image/*"></label>
    <img class="preview" id="preview" alt="Photo preview">
    <p class="err" id="err" role="alert"></p>
    <button class="primary" type="submit">Save puzzle</button>
  </form>
  <section>
    <div id="list" class="grid" aria-live="polite"></div>
  </section>
</div>
</main>
<dialog id="dlg"><img id="big" alt=""><button type="button" id="close">Close</button></dialog>

<script>
(function(){
  var items=[];
  var $=function(id){return document.getElementById(id)};

  function api(path,opts){
    return fetch(path,opts).then(function(r){
      if(r.status===401){showAuth();throw new Error('auth')}
      if(!r.ok)throw new Error('Request failed ('+r.status+')');
      return r.status===204?null:r.json();
    });
  }
  function prep(i){i.photo=i.has_photo?'/api/puzzles/'+i.id+'/photo':'';i.created=Date.parse(i.created_at)||0;return i}

  function shrink(file){return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej()};
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){rej()};
      img.onload=function(){
        var m=1200,s=Math.min(1,m/Math.max(img.width,img.height));
        var c=document.createElement('canvas');
        c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.82));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  })}

  function fmtDate(s){
    var p=s.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);
    return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
  }
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}

  function render(){
    items.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.created-a.created});
    var list=$('list');list.textContent='';
    var total=0;
    items.forEach(function(i){total+=i.pieces});
    $('tCount').textContent=items.length.toLocaleString();
    $('tPieces').textContent=total.toLocaleString();
    if(!items.length){
      var e=el('div','empty','No puzzles logged yet. Fill in the form to add your first one.');
      e.style.gridColumn='1/-1';list.appendChild(e);return;
    }
    items.forEach(function(i){
      var card=el('article','card');
      if(i.photo){
        var b=el('button','ph');b.type='button';b.setAttribute('aria-label','View photo of '+i.name);
        var im=document.createElement('img');im.src=i.photo;im.alt=i.name;im.className='ph';im.loading='lazy';im.style.cursor='zoom-in';
        b.appendChild(im);
        b.addEventListener('click',function(){$('big').src=i.photo;$('big').alt=i.name;$('dlg').showModal()});
        card.appendChild(b);
      }else card.appendChild(el('div','nophoto','No photo'));
      var body=el('div','body');
      body.appendChild(el('h3',null,i.name));
      body.appendChild(el('div','meta',fmtDate(i.date)));
      body.appendChild(el('span','pieces',i.pieces.toLocaleString()+' pieces'));
      var d=el('button','del','Delete');d.type='button';
      d.addEventListener('click',function(){
        if(!confirm('Delete "'+i.name+'"?'))return;
        api('/api/puzzles/'+i.id,{method:'DELETE'}).then(function(){
          items=items.filter(function(x){return x.id!==i.id});render();
        }).catch(function(){$('err').textContent='Could not delete that puzzle. Try again.'});
      });
      body.appendChild(d);card.appendChild(body);list.appendChild(card);
    });
  }

  var today=new Date();
  $('date').value=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  var photoData='';
  $('photo').addEventListener('change',function(){
    var f=this.files&&this.files[0];photoData='';$('preview').style.display='none';$('err').textContent='';
    if(!f)return;
    shrink(f).then(function(d){photoData=d;$('preview').src=d;$('preview').style.display='block'})
      .catch(function(){$('err').textContent='That file could not be read as an image. Try a JPG or PNG.'});
  });
  $('f').addEventListener('submit',function(e){
    e.preventDefault();
    var name=$('name').value.trim(),date=$('date').value,pieces=parseInt($('pieces').value,10);
    if(!date||!name||!(pieces>0)){$('err').textContent='Enter a date, a puzzle name and the number of pieces.';return}
    var btn=e.target.querySelector('.primary');btn.disabled=true;$('err').textContent='';
    api('/api/puzzles',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({date:date,name:name,pieces:pieces,photo:photoData})})
    .then(function(row){
      items.push(prep(row));
      $('name').value='';$('pieces').value='';$('photo').value='';photoData='';$('preview').style.display='none';
      render();$('name').focus();
    }).catch(function(){$('err').textContent='Could not save the puzzle. Check your connection and try again.'})
    .then(function(){btn.disabled=false});
  });
  $('close').addEventListener('click',function(){$('dlg').close()});
  $('dlg').addEventListener('click',function(e){if(e.target===this)this.close()});

  var mode='login';
  function setMode(m){
    mode=m;$('aerr').textContent='';
    $('tabLogin').setAttribute('aria-selected',m==='login');
    $('tabSignup').setAttribute('aria-selected',m==='signup');
    $('asubmit').textContent=m==='login'?'Log in':'Create account';
    $('p').autocomplete=m==='login'?'current-password':'new-password';
    $('ahint').textContent=m==='signup'?'Pick a username (3 to 30 letters, numbers, . - _) and a password of 8+ characters.':'';
  }
  $('tabLogin').addEventListener('click',function(){setMode('login')});
  $('tabSignup').addEventListener('click',function(){setMode('signup')});
  function showAuth(){
    items=[];$('app').hidden=true;$('auth').hidden=false;$('p').value='';setMode(mode);
  }
  function showApp(name){
    $('who').textContent=name;$('auth').hidden=true;$('app').hidden=false;$('err').textContent='';render();
    api('/api/puzzles').then(function(r){items=r.map(prep);render()})
      .catch(function(){$('err').textContent='Could not load your puzzles. Refresh to try again.'});
  }
  $('af').addEventListener('submit',function(e){
    e.preventDefault();
    var u=$('u').value.trim(),p=$('p').value;
    if(!u||!p){$('aerr').textContent='Enter a username and password.';return}
    var btn=$('asubmit');btn.disabled=true;$('aerr').textContent='';
    fetch('/api/'+(mode==='login'?'login':'signup'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})})
      .then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d}})})
      .then(function(x){
        if(x.ok){$('p').value='';showApp(x.d.username)}
        else $('aerr').textContent=x.d.error||'Something went wrong.';
      })
      .catch(function(){$('aerr').textContent='Could not reach the server. Try again.'})
      .then(function(){btn.disabled=false});
  });
  $('logout').addEventListener('click',function(){
    fetch('/api/logout',{method:'POST'}).catch(function(){}).then(function(){$('u').value='';showAuth()});
  });
  fetch('/api/me').then(function(r){return r.ok?r.json():null})
    .then(function(u){u?showApp(u.username):showAuth()}).catch(showAuth);
})();
</script>
</body>
</html>
