<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puzzle Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f5f6fa;--panel:#fff;--ink:#0f1729;--mute:#66728a;--line:#e5e8f0;--field:#f1f3f9;--accent:#cf3a18;--accent-ink:#fff;--accent-strong:#a82d12;--danger:#d1382b;--r:18px;
--shadow:0 1px 2px rgba(15,23,41,.05),0 8px 24px rgba(15,23,41,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f1e;--panel:#131b30;--ink:#eef1f8;--mute:#93a0ba;--line:#222d48;--field:#0d1426;--accent:#ff6a47;--accent-ink:#1a0a05;--accent-strong:#ff9a82;--danger:#ff8a7d;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0a0f1e;--panel:#131b30;--ink:#eef1f8;--mute:#93a0ba;--line:#222d48;--field:#0d1426;--accent:#ff6a47;--accent-ink:#1a0a05;--accent-strong:#ff9a82;--danger:#ff8a7d;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font:400 16px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
background:radial-gradient(900px 420px at 8% -8%,color-mix(in srgb,var(--accent) 13%,transparent),transparent 70%),radial-gradient(700px 380px at 100% 0,color-mix(in srgb,var(--ink) 6%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
main{max-width:1040px;margin:0 auto;padding:30px 20px 64px}
h1,h2,h3{margin:0;letter-spacing:-.02em}
h1{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800;line-height:1.1;display:flex;align-items:center}
h2{font-size:1.2rem;font-weight:700}
.logo{width:1em;height:1em;color:var(--accent);margin-right:.35em;flex:none}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}
.totals{display:flex;gap:12px;flex-wrap:wrap}
.totals>div{background:var(--panel);box-shadow:var(--shadow);border-radius:16px;padding:11px 18px;min-width:112px;color:var(--mute);font-size:.82rem;font-weight:500}
.totals b{display:block;font-size:1.65rem;font-weight:800;line-height:1.15;color:var(--ink);letter-spacing:-.02em}
.layout{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
form{background:var(--panel);box-shadow:var(--shadow);border-radius:var(--r);padding:22px;display:grid;gap:15px}
label{display:grid;gap:6px;font-weight:600;font-size:.88rem}
input,select{font:inherit;color:var(--ink);background:var(--field);border:1.5px solid transparent;border-radius:12px;padding:11px 14px;width:100%;transition:border-color .15s,background .15s}
select{width:auto}
input:hover,select:hover{border-color:var(--line)}
input:focus,select:focus{outline:none;border-color:var(--accent);background:var(--panel)}
input[type=file]{padding:8px;font-size:.88rem;color:var(--mute)}
input[type=file]::file-selector-button{font:600 .85rem "Plus Jakarta Sans",sans-serif;border:0;border-radius:99px;padding:7px 14px;margin-right:10px;background:var(--ink);color:var(--bg);cursor:pointer}
button{font:600 1rem "Plus Jakarta Sans",sans-serif;cursor:pointer;border-radius:12px;border:0;padding:12px 18px;transition:transform .12s,filter .12s,background .12s}
button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 8px 18px color-mix(in srgb,var(--accent) 28%,transparent)}
.primary:hover{transform:translateY(-1px);filter:brightness(1.06)}
.primary:active{transform:none}
.primary:disabled{opacity:.6;cursor:default;transform:none}
.preview{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;display:none}
.err{color:var(--danger);font-size:.88rem;min-height:1.2em;margin:0;font-weight:500}
.hint{margin:0;color:var(--mute);font-size:.84rem;min-height:1.2em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--panel);box-shadow:var(--shadow);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;animation:up .35s ease both;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px)}
.card .ph{aspect-ratio:4/3;width:100%;object-fit:cover;background:var(--field);display:block;cursor:zoom-in;border:0;padding:0;border-radius:0}
.card .nophoto{aspect-ratio:4/3;display:grid;place-items:center;color:var(--mute);background:var(--field);font-size:.88rem}
.card .body{padding:14px 16px 16px;display:grid;gap:3px}
.card h3{font-size:1.05rem;font-weight:700;line-height:1.3}
.meta{color:var(--mute);font-size:.86rem}
.pieces{display:inline-block;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent-strong);border-radius:99px;padding:3px 12px;font-size:.8rem;font-weight:700;justify-self:start;margin-top:6px}
.del{background:none;color:var(--mute);padding:6px 0 0;justify-self:start;font-size:.82rem;font-weight:500;text-decoration:underline;text-underline-offset:3px;border-radius:6px}
.del:hover{color:var(--danger)}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:44px 20px;text-align:center;color:var(--mute)}
.auth{min-height:100vh;display:grid;place-items:center;padding:28px 18px}
.authwrap{width:min(440px,100%);display:grid;gap:20px}
.authwrap h1{justify-content:center;font-size:clamp(2.2rem,8vw,3.2rem)}
.tag{margin:0;color:var(--mute);text-align:center}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--field);padding:4px;border-radius:14px}
.tabs button{background:none;color:var(--mute);padding:9px;font-size:.92rem;border-radius:11px}
.tabs button[aria-selected=true]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.apptabs{max-width:340px;margin-bottom:20px;background:var(--panel);box-shadow:var(--shadow)}
.apptabs button[aria-selected=true]{background:var(--ink);color:var(--bg);box-shadow:none}
.boardbar{display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.boardbar label{min-width:150px}
.tablewrap{overflow-x:auto;background:var(--panel);box-shadow:var(--shadow);border-radius:var(--r)}
table{width:100%;border-collapse:collapse}
th,td{padding:13px 18px;text-align:left}
th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:700;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td:nth-child(n+3),th:nth-child(n+3){text-align:right}
td:first-child{width:3.2rem;font-weight:800}
tbody tr:nth-child(-n+3) td:first-child{color:var(--accent)}
tr.me td{background:color-mix(in srgb,var(--accent) 12%,transparent);font-weight:700}
dialog{border:0;padding:0;background:none;max-width:94vw;max-height:94vh}
dialog::backdrop{background:rgba(8,12,24,.8);backdrop-filter:blur(4px)}
#dlg img{max-width:94vw;max-height:86vh;border-radius:18px;display:block}
#dlg button{margin-top:10px;background:var(--panel);color:var(--ink)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.actions{display:flex;gap:16px}
.edit:hover{color:var(--accent-strong)}
.check{display:flex;align-items:center;gap:8px;font-weight:500}
.check input{width:auto}
.ghost{background:var(--field);color:var(--ink)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
#formDlg{width:min(440px,94vw);max-height:92vh;overflow:auto;border-radius:var(--r);color:var(--ink)}
#formDlg form{box-shadow:none}
</style>
</head>
<body>
<section id="auth" class="auth" hidden>
  <div class="authwrap">
    <h1><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 6h8.5a3.5 3.5 0 1 1 7 0H26v8.5a3.5 3.5 0 1 0 0 7V26H6z" fill="currentColor"/></svg>Puzzle Log</h1>
    <p class="tag">Keep a record of every puzzle you finish: the date, the piece count and a photo of the finished picture.</p>
    <form id="af" novalidate>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tabLogin" aria-selected="true">Log in</button>
        <button type="button" role="tab" id="tabSignup" aria-selected="false">Sign up</button>
      </div>
      <label>Username<input id="u" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="30" required></label>
      <label>Password<input id="p" type="password" autocomplete="current-password" maxlength="200" required></label>
      <p class="hint" id="ahint"></p>
      <p class="err" id="aerr" role="alert"></p>
      <button class="primary" type="submit" id="asubmit">Log in</button>
    </form>
  </div>
</section>
<main id="app" hidden>
<header>
  <h1><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 6h8.5a3.5 3.5 0 1 1 7 0H26v8.5a3.5 3.5 0 1 0 0 7V26H6z" fill="currentColor"/></svg>Puzzle Log</h1>
  <div class="totals"><div><b id="tCount">0</b>puzzles</div><div><b id="tPieces">0</b>pieces placed</div><div><b id="who" style="font-size:1.05rem"></b><button type="button" id="logout" class="del">Log out</button></div></div>
</header>
<div class="tabs apptabs" role="tablist">
  <button type="button" role="tab" id="tabMine" aria-selected="true">My puzzles</button>
  <button type="button" role="tab" id="tabBoard" aria-selected="false">Leaderboard</button>
</div>
<div id="mine">
  <div class="toolbar"><h2>Your puzzles</h2><button type="button" class="primary" id="add">+ Add puzzle</button></div>
  <div id="list" class="grid" aria-live="polite"></div>
</div>
<section id="board" hidden>
  <div class="boardbar">
    <label>Period<select id="bPeriod"><option value="all">All time</option><option value="month">This month</option></select></label>
    <label>Rank by<select id="bSort"><option value="pieces">Pieces</option><option value="puzzles">Puzzles</option></select></label>
  </div>
  <div class="tablewrap"><table><thead><tr><th>#</th><th>Player</th><th>Puzzles</th><th>Pieces</th></tr></thead><tbody id="bBody"></tbody></table></div>
  <p class="hint" id="bMsg" aria-live="polite"></p>
</section>
</main>
<dialog id="formDlg"><form id="f" novalidate>
    <h2 id="formTitle">Log a puzzle</h2>
    <label>Date completed<input type="date" id="date" required></label>
    <label>Puzzle name<input type="text" id="name" maxlength="120" placeholder="e.g. Amalfi Coast" required></label>
    <label>Number of pieces<input type="number" id="pieces" min="1" max="100000" inputmode="numeric" placeholder="e.g. 1000" required></label>
    <label>Photo<input type="file" id="photo" accept="image/*"></label>
    <img class="preview" id="preview" alt="Photo preview">
    <label class="check" id="rmWrap" hidden><input type="checkbox" id="rm"> Remove current photo</label>
    <p class="err" id="err" role="alert"></p>
    <button class="primary" type="submit" id="save">Save puzzle</button>
    <button type="button" class="ghost" id="cancel">Cancel</button>
  </form></dialog>
<dialog id="dlg"><img id="big" alt=""><button type="button" id="close">Close</button></dialog>

<script>
(function(){
  var items=[];
  var $=function(id){return document.getElementById(id)};

  function api(path,opts){
    return fetch(path,opts).then(function(r){
      if(r.status===401){showAuth();throw new Error('auth')}
      if(!r.ok)throw new Error('Request failed ('+r.status+')');
      return r.status===204?null:r.json();
    });
  }
  function prep(i){i.photo=i.has_photo?'/api/puzzles/'+i.id+'/photo?v='+(i.photo_len||0):'';i.created=Date.parse(i.created_at)||0;return i}

  function shrink(file){return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej()};
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){rej()};
      img.onload=function(){
        var m=1200,s=Math.min(1,m/Math.max(img.width,img.height));
        var c=document.createElement('canvas');
        c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.82));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  })}

  function fmtDate(s){
    var p=s.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);
    return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
  }
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}

  function render(){
    items.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.created-a.created});
    var list=$('list');list.textContent='';
    var total=0;
    items.forEach(function(i){total+=i.pieces});
    $('tCount').textContent=items.length.toLocaleString();
    $('tPieces').textContent=total.toLocaleString();
    if(!items.length){
      var e=el('div','empty','No puzzles logged yet. Tap Add puzzle to log your first one.');
      e.style.gridColumn='1/-1';list.appendChild(e);return;
    }
    items.forEach(function(i){
      var card=el('article','card');
      if(i.photo){
        var b=el('button','ph');b.type='button';b.setAttribute('aria-label','View photo of '+i.name);
        var im=document.createElement('img');im.src=i.photo;im.alt=i.name;im.className='ph';im.loading='lazy';im.style.cursor='zoom-in';
        b.appendChild(im);
        b.addEventListener('click',function(){$('big').src=i.photo;$('big').alt=i.name;$('dlg').showModal()});
        card.appendChild(b);
      }else card.appendChild(el('div','nophoto','No photo'));
      var body=el('div','body');
      body.appendChild(el('h3',null,i.name));
      body.appendChild(el('div','meta',fmtDate(i.date)));
      body.appendChild(el('span','pieces',i.pieces.toLocaleString()+' pieces'));
      var d=el('button','del','Delete');d.type='button';
      d.addEventListener('click',function(){
        if(!confirm('Delete "'+i.name+'"?'))return;
        api('/api/puzzles/'+i.id,{method:'DELETE'}).then(function(){
          items=items.filter(function(x){return x.id!==i.id});if(editingId===i.id)resetForm();render();
        }).catch(function(){$('err').textContent='Could not delete that puzzle. Try again.'});
      });
      var ed=el('button','del edit','Edit');ed.type='button';ed.addEventListener('click',function(){startEdit(i)});var act=el('div','actions');act.appendChild(ed);act.appendChild(d);body.appendChild(act);card.appendChild(body);list.appendChild(card);
    });
  }

  var editingId=null,editPhotoUrl='';
  function todayStr(){var t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
  $('date').value=todayStr();
  var photoData='';
  function resetForm(){
    editingId=null;editPhotoUrl='';photoData='';
    $('name').value='';$('pieces').value='';$('photo').value='';$('rm').checked=false;
    $('preview').style.display='none';$('rmWrap').hidden=true;
    $('formTitle').textContent='Log a puzzle';$('save').textContent='Save puzzle';$('err').textContent='';
    $('date').value=todayStr();
  }
  function startEdit(i){
    editingId=i.id;editPhotoUrl=i.photo||'';photoData='';
    $('name').value=i.name;$('date').value=i.date;$('pieces').value=i.pieces;
    $('photo').value='';$('rm').checked=false;$('err').textContent='';
    $('formTitle').textContent='Edit puzzle';$('save').textContent='Save changes';
    $('rmWrap').hidden=!i.photo;
    if(i.photo){$('preview').src=i.photo;$('preview').style.display='block'}else $('preview').style.display='none';
    $('formDlg').showModal();$('name').focus();
  }
  $('cancel').addEventListener('click',function(){$('formDlg').close()});
  $('formDlg').addEventListener('close',resetForm);
  $('formDlg').addEventListener('click',function(e){if(e.target===this)this.close()});
  $('add').addEventListener('click',function(){resetForm();$('formDlg').showModal();$('name').focus()});
  $('rm').addEventListener('change',function(){
    if(this.checked){photoData='';$('photo').value='';$('preview').style.display='none'}
    else if(editPhotoUrl&&!photoData){$('preview').src=editPhotoUrl;$('preview').style.display='block'}
  });
  $('photo').addEventListener('change',function(){
    var f=this.files&&this.files[0];photoData='';$('preview').style.display='none';$('err').textContent='';
    if(!f){if(editingId&&editPhotoUrl&&!$('rm').checked){$('preview').src=editPhotoUrl;$('preview').style.display='block'}return}
    shrink(f).then(function(d){photoData=d;$('preview').src=d;$('preview').style.display='block'})
      .catch(function(){$('err').textContent='That file could not be read as an image. Try a JPG or PNG.'});
  });
  $('f').addEventListener('submit',function(e){
    e.preventDefault();
    var name=$('name').value.trim(),date=$('date').value,pieces=parseInt($('pieces').value,10);
    if(!date||!name||!(pieces>0)){$('err').textContent='Enter a date, a puzzle name and the number of pieces.';return}
    var btn=$('save');btn.disabled=true;$('err').textContent='';
    var editing=editingId,body={date:date,name:name,pieces:pieces};
    if(editing){if($('rm').checked)body.removePhoto=true;else if(photoData)body.photo=photoData}
    else body.photo=photoData;
    api(editing?'/api/puzzles/'+editing:'/api/puzzles',{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(row){
      row=prep(row);
      if(editing)items=items.map(function(x){return x.id===editing?row:x});else items.push(row);
      resetForm();$('formDlg').close();render();
    }).catch(function(){$('err').textContent='Could not save the puzzle. Check your connection and try again.'})
    .then(function(){btn.disabled=false});
  });
  $('close').addEventListener('click',function(){$('dlg').close()});
  $('dlg').addEventListener('click',function(e){if(e.target===this)this.close()});

  function tab(which){
    var b=which==='board';
    $('mine').hidden=b;$('board').hidden=!b;
    $('tabMine').setAttribute('aria-selected',!b);$('tabBoard').setAttribute('aria-selected',b);
    if(b)loadBoard();
  }
  function loadBoard(){
    $('bMsg').textContent='Loading...';
    api('/api/leaderboard?period='+$('bPeriod').value+'&sort='+$('bSort').value).then(function(rows){
      var tb=$('bBody');tb.textContent='';
      rows.forEach(function(r,i){
        var tr=document.createElement('tr');if(r.me)tr.className='me';
        [i+1,r.username+(r.me?' (you)':''),r.puzzles.toLocaleString(),r.pieces.toLocaleString()].forEach(function(v){tr.appendChild(el('td',null,String(v)))});
        tb.appendChild(tr);
      });
      $('bMsg').textContent=rows.length?'':'No puzzles logged for this period yet.';
    }).catch(function(){$('bMsg').textContent='Could not load the leaderboard.'});
  }
  $('tabMine').addEventListener('click',function(){tab('mine')});
  $('tabBoard').addEventListener('click',function(){tab('board')});
  $('bPeriod').addEventListener('change',loadBoard);
  $('bSort').addEventListener('change',loadBoard);
  var mode='login';
  function setMode(m){
    mode=m;$('aerr').textContent='';
    $('tabLogin').setAttribute('aria-selected',m==='login');
    $('tabSignup').setAttribute('aria-selected',m==='signup');
    $('asubmit').textContent=m==='login'?'Log in':'Create account';
    $('p').autocomplete=m==='login'?'current-password':'new-password';
    $('ahint').textContent=m==='signup'?'Pick a username (3 to 30 letters, numbers, . - _) and a password of 8+ characters.':'';
  }
  $('tabLogin').addEventListener('click',function(){setMode('login')});
  $('tabSignup').addEventListener('click',function(){setMode('signup')});
  function showAuth(){
    if($('formDlg').open)$('formDlg').close();resetForm();items=[];$('app').hidden=true;$('auth').hidden=false;$('p').value='';setMode(mode);
  }
  function showApp(name){tab('mine');
    $('who').textContent=name;$('auth').hidden=true;$('app').hidden=false;$('err').textContent='';render();
    api('/api/puzzles').then(function(r){items=r.map(prep);render()})
      .catch(function(){$('err').textContent='Could not load your puzzles. Refresh to try again.'});
  }
  $('af').addEventListener('submit',function(e){
    e.preventDefault();
    var u=$('u').value.trim(),p=$('p').value;
    if(!u||!p){$('aerr').textContent='Enter a username and password.';return}
    var btn=$('asubmit');btn.disabled=true;$('aerr').textContent='';
    fetch('/api/'+(mode==='login'?'login':'signup'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})})
      .then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d}})})
      .then(function(x){
        if(x.ok){$('p').value='';showApp(x.d.username)}
        else $('aerr').textContent=x.d.error||'Something went wrong.';
      })
      .catch(function(){$('aerr').textContent='Could not reach the server. Try again.'})
      .then(function(){btn.disabled=false});
  });
  $('logout').addEventListener('click',function(){
    fetch('/api/logout',{method:'POST'}).catch(function(){}).then(function(){$('u').value='';showAuth()});
  });
  fetch('/api/me').then(function(r){return r.ok?r.json():null})
    .then(function(u){u?showApp(u.username):showAuth()}).catch(showAuth);
})();
</script>
</body>
</html>
